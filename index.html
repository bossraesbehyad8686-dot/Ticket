<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صدور بلیت سفر</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        display: flex; align-items: center; justify-content: center;
        padding: 20px;
    }
    .box {
        width: 100%; max-width: 460px;
        background: #fff;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }
    .box-header {
        background: linear-gradient(135deg, #f7971e, #ffd200);
        padding: 22px; text-align: center;
    }
    .box-header h1 { color: #333; font-size: 22px; }
    .box-header p { color: #555; font-size: 12px; margin-top: 5px; }
    .box-body { padding: 25px; }
    .field { margin-bottom: 16px; }
    .field label {
        display: block; margin-bottom: 6px;
        font-size: 13px; font-weight: bold; color: #444;
    }
    .field input, .field select {
        width: 100%; padding: 11px 14px;
        border: 2px solid #e0e0e0;
        border-radius: 12px; font-size: 14px;
        background: #fafafa; transition: 0.25s;
    }
    .field input:focus, .field select:focus {
        border-color: #f7971e; background: #fff; outline: none;
        box-shadow: 0 0 0 4px rgba(247,151,30,0.15);
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-main {
        width: 100%; padding: 14px;
        background: linear-gradient(135deg, #f7971e, #ffd200);
        color: #333; border: none; border-radius: 12px;
        font-size: 16px; font-weight: bold; cursor: pointer;
        transition: 0.25s;
    }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(247,151,30,0.4); }
    .msg { color: #e74c3c; font-size: 13px; text-align: center; margin-bottom: 12px; display: none; }

    .ticket {
        display: none; background: #fff;
        border-radius: 18px; overflow: hidden;
        box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }
    .ticket-top {
        background: linear-gradient(135deg, #0f2027, #2c5364);
        color: #fff; padding: 20px;
    }
    .ticket-top h2 { font-size: 18px; margin-bottom: 6px; }
    .ticket-top .code { font-size: 12px; opacity: 0.85; letter-spacing: 1px; }
    .ticket-mid { padding: 22px 20px; }
    .flight-path {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 20px; background: #f8f9fa;
        border-radius: 14px; padding: 15px;
    }
    .city-block { text-align: center; }
    .city-block .city-name { font-size: 17px; font-weight: bold; color: #0f2027; }
    .city-block .city-sub { font-size: 10px; color: #999; margin-top: 3px; }
    .plane-icon { font-size: 22px; color: #f7971e; }
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .detail-item { background: #f8f9fa; border-radius: 12px; padding: 10px 12px; }
    .detail-item .lbl { font-size: 10px; color: #999; }
    .detail-item .val { font-size: 14px; font-weight: bold; color: #333; margin-top: 3px; }
    .status-badge {
        display: inline-block; background: #27ae60; color: #fff;
        padding: 3px 10px; border-radius: 20px; font-size: 11px;
    }
    .barcode-new {
        margin-top: 18px; height: 55px;
        background: repeating-linear-gradient(90deg,
            #0f2027 0px, #0f2027 1px, transparent 1px, transparent 3px,
            #0f2027 3px, #0f2027 6px, transparent 6px, transparent 8px,
            #0f2027 8px, #0f2027 9px, transparent 9px, transparent 12px);
        border-radius: 4px;
    }
    .ticket-btm {
        text-align: center; font-size: 11px; color: #999;
        padding: 12px; border-top: 1px dashed #ddd;
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .btn-print {
        padding: 12px; background: #0f2027; color: #fff;
        border: none; border-radius: 12px;
        font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .btn-new {
        padding: 12px; background: #f7971e; color: #333;
        border: none; border-radius: 12px;
        font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .btn-print:hover, .btn-new:hover { opacity: 0.9; }
</style>
</head>
<body>
  <div class="box">
    <div class="box-header">
        <h1>✈️ دفتر فروش بلیت</h1>
        <p>سریع، آسان و مطمئن</p>
    </div>

    <div class="box-body" id="formBox">
        <div class="msg" id="msg"></div>

        <div class="field">
            <label>نام و نام خانوادگی</label>
            <input type="text" id="name" placeholder="مثلاً: سارا احمدی">
        </div>

        <div class="field">
            <label>مبدأ</label>
            <select id="origin">
                <option value="">انتخاب کنید</option>
            </select>
        </div>

        <div class="field">
            <label>مقصد</label>
            <select id="destination">
                <option value="">انتخاب کنید</option>
            </select>
        </div>

        <div class="field row2">
            <div>
                <label>تاریخ حرکت</label>
                <input type="date" id="date">
            </div>
            <div>
                <label>کلاس پرواز</label>
                <select id="tclass">
                    <option>اقتصادی</option>
                    <option>بیزینس</option>
                    <option>فرست کلاس</option>
                </select>
            </div>
        </div>

        <button class="btn-main" onclick="makeTicket()">🎫 صدور بلیت</button>
    </div>

    <div class="box-body" id="ticketBox" style="display:none;">
        <div class="ticket" style="display:block;">
            <div class="ticket-top">
                <h2>🎫 بلیت سفر</h2>
                <div class="code">کد رهگیری: <b id="tCode"></b></div>
            </div>
            <div class="ticket-mid">
                <div class="flight-path">
                    <div class="city-block">
                        <div class="city-name" id="tFrom">-</div>
                        <div class="city-sub">مبدأ</div>
                    </div>
                    <div class="plane-icon">✈️</div>
                    <div class="city-block">
                        <div class="city-name" id="tTo">-</div>
                        <div class="city-sub">مقصد</div>
                    </div>
                </div>
                <div class="details">
                    <div class="detail-item">
                        <div class="lbl">مسافر</div>
                        <div class="val" id="tName">-</div>
                    </div>
                    <div class="detail-item">
                        <div class="lbl">تاریخ</div>
                        <div class="val" id="tDate">-</div>
                    </div>
                    <div class="detail-item">
                        <div class="lbl">شماره صندلی</div>
                        <div class="val" id="tSeat">-</div>
                    </div>
                    <div class="detail-item">
                        <div class="lbl">کلاس</div>
                        <div class="val" id="tClass">-</div>
                    </div>
                    <div class="detail-item">
                        <div class="lbl">وضعیت</div>
                        <div class="val"><span class="status-badge">تأیید شد ✓</span></div>
                    </div>
                    <div class="detail-item">
                        <div class="lbl">شماره پرواز</div>
                        <div class="val" id="tFlight">-</div>
                    </div>
                </div>
                <div class="barcode-new"></div>
            </div>
            <div class="ticket-btm">از سفر خود لذت ببرید 🌟 | دفتر فروش بلیت</div>
        </div>

        <div class="actions">
            <button class="btn-print" onclick="printTicket()">🖨️ چاپ بلیت</button>
            <button class="btn-new" onclick="newTicket()">🎫 بلیت جدید</button>
        </div>
    </div>
</div>

<script>
    // لیست کامل شهرهای ایران
    const cities = [
        "تهران", "مشهد", "اصفهان", "شیراز", "تبریز", "کرج", "اهواز",
        "قم", "کرمانشاه", "ارومیه", "زاهدان", "رشت", "کرمان", "یزد",
        "اردبیل", "بندرعباس", "اراک", "اسلامشهر", "زنجان", "سنندج",
        "قزوین", "خرم‌آباد", "گرگان", "ساری", "بجنورد", "بوشهر",
        "بیرجند", "ایلام", "شهرکرد", "سمنان", "یاسوج", "کیش",
        "قشم", "چابهار", "انزلی", "رامسر", "بابلسر", "نوشهر",
        "لاهیجان", "خوی", "مراغه", "مرند", "میاندوآب", "بوکان",
        "سقز", "مهاباد", "پیرانشهر", "نقده", "تکاب", "شاهین‌دژ"
    ];

    // پر کردن خودکار لیست شهرها
    window.onload = function() {
        const originSel = document.getElementById('origin');
        const destSel = document.getElementById('destination');
        cities.forEach(function(city) {
            const o1 = document.createElement('option');
            o1.textContent = city;
            o1.value = city;
            originSel.appendChild(o1);

            const o2 = document.createElement('option');
            o2.textContent = city;
            o2.value = city;
            destSel.appendChild(o2);
        });
    };

    function makeTicket() {
        const name = document.getElementById('name').value.trim();
        const origin = document.getElementById('origin').value;
        const destination = document.getElementById('destination').value;
        const date = document.getElementById('date').value;
        const tclass = document.getElementById('tclass').value;
        const msg = document.getElementById('msg');

        if (!name || !origin || !destination || !date) {
            msg.style.display = 'block';
            msg.textContent = 'لطفاً همه فیلدها را پر کنید!';
            return;
        }
        if (origin === destination) {
            msg.style.display = 'block';
            msg.textContent = 'مبدأ و مقصد نمی‌توانند یکسان باشند!';
            return;
        }
        msg.style.display = 'none';

        const code = 'FL-' + Math.floor(10000 + Math.random() * 90000);
        const flightNo = 'IR' + Math.floor(100 + Math.random() * 900);
        const seat = Math.floor(1 + Math.random() * 40) + 'A';

        const dateObj = new Date(date);
        const fdate = dateObj.toLocaleDateString('fa-IR',
            { year: 'numeric', month: 'long', day: 'numeric' });

        document.getElementById('tCode').textContent = code;
        document.getElementById('tName').textContent = name;
        document.getElementById('tFrom').textContent = origin;
        document.getElementById('tTo').textContent = destination;
        document.getElementById('tDate').textContent = fdate;
        document.getElementById('tSeat').textContent = seat;
        document.getElementById('tClass').textContent = tclass;
        document.getElementById('tFlight').textContent = flightNo;

        document.getElementById('formBox').style.display = 'none';
        document.getElementById('ticketBox').style.display = 'block';
    }

    function printTicket() {
        window.print();
    }

    function newTicket() {
        document.getElementById('name').value = '';
        document.getElementById('origin').value = '';
        document.getElementById('destination').value = '';
        document.getElementById('date').value = '';
        document.getElementById('tclass').value = 'اقتصادی';

        document.getElementById('ticketBox').style.display = 'none';
        document.getElementById('formBox').style.display = 'block';
    }
</script>

</body>
</html>
